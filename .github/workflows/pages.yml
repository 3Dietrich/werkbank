name: Deploy GitHub Pages

# Statische Seite (reine ES-Module, kein Build):
#  • Push auf main  → https://3dietrich.github.io/werkbank/          (aktueller Stand)
#  • Push Tag v*    → https://3dietrich.github.io/werkbank/<tag>/    (eingefrorener Stand)
# Der main-Deploy baut die Tag-Unterordner jedes Mal frisch aus dem Git-Verlauf
# mit — so bleiben eingefrorene Stände erhalten, ohne Bestand retten zu müssen.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Tags für die Frozen-Stände sichtbar machen

      - name: _site zusammenstellen
        run: |
          set -e
          mkdir -p _site
          EXCLUDES="--exclude=.git --exclude=.github --exclude=_site \
                    --exclude=test-results --exclude=__pycache__ --exclude=*.bak"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tag-Deploy: nur der eigene Unterordner wird ersetzt. Der Rest der
            # Seite (main + andere Tags) wird beim nächsten main-Deploy ohnehin
            # wieder vollständig aufgebaut; hier stellen wir die übrigen Stände
            # ebenfalls her, damit das Artifact komplett ist.
            rsync -a $EXCLUDES ./ "_site/"
            mv _site ".tagbuild"
            mkdir -p "_site/$GITHUB_REF_NAME"
            rsync -a ".tagbuild/" "_site/$GITHUB_REF_NAME/"
            rm -rf .tagbuild
            # main-Stand ins Root, andere Tags in ihre Unterordner:
            git archive main | tar -x -C _site
            rm -rf _site/.github _site/test-results
            for TAG in $(git tag -l 'v*' | grep -v "^${GITHUB_REF_NAME}\$"); do
              mkdir -p "_site/$TAG"
              git archive "$TAG" | tar -x -C "_site/$TAG"
              rm -rf "_site/$TAG/.github" "_site/$TAG/test-results"
            done
          else
            # main-Deploy: Root frisch + alle Tags frisch daneben.
            rsync -a $EXCLUDES ./ _site/
            for TAG in $(git tag -l 'v*'); do
              mkdir -p "_site/$TAG"
              git archive "$TAG" | tar -x -C "_site/$TAG"
              rm -rf "_site/$TAG/.github" "_site/$TAG/test-results"
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
