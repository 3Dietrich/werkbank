name: Deploy GitHub Pages

# Statische Seite (reine ES-Module, kein Build):
#   main      -> https://3dietrich.github.io/werkbank/
#   Tag v*    -> https://3dietrich.github.io/werkbank/<tag>/
# Bei jedem Lauf werden main ins Root und alle Tags in Unterordner gelegt,
# so bleibt das Artefakt unabhaengig vom Ausloeser immer vollstaendig.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NICHT abbrechen: ein Tag-Push direkt nach main-Push darf den main-Deploy nicht
  # canceln (sonst fehlt danach der Root-Stand). Deploys laufen seriell hintereinander.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        run: bash tools/build_pages.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
